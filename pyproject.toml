[project]
name = "mascriss-ai"
version = "0.1.0"
description = "Supply Chain Crisis Sentinel — Multi-Agent System (CrewAI + MCP)"
authors = [{ name = "Sudip Das", email = "codex.tagc@gmail.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.9.0,<2.0.0",
    "fastmcp>=2.0.0",
    "langchain-groq>=1.0.0",
]

[project.scripts]
mascriss-ai = "main:run"
run_crew = "main:run"
train = "main:train"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.crewai]
type = "crew"
